bind r source-file ~/.tmux.conf \; display "Config reloaded!"


# -- Basic Settings ------------------------------------------
set -g prefix C-s
set -g escape-time 500
set -g history-limit 5000

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

